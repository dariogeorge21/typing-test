<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typing Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div>
                <h1>Typing Test</h1>
                <p>Modern, minimal, and focused typing practice.</p>
            </div>
            <div class="restart-hint" aria-label="Restart hint">
                <span>Press</span>
                <kbd>`</kbd>
                <span>to restart</span>
            </div>
        </header>

        <section class="stats-container" aria-label="Live typing stats">
            <div class="timer stat-card">
                <span class="stat-label">Time</span>
                <span id="time" class="stat-value">30s</span>
            </div>
            <div class="text-controls stat-card" aria-label="Text size controls">
                <button id="decrease-text" class="control-btn" aria-label="Decrease text size">A-</button>
                <span id="text-size">32px</span>
                <button id="increase-text" class="control-btn" aria-label="Increase text size">A+</button>
            </div>
            <div class="speed stat-card">
                <span class="stat-label">Speed</span>
                <span id="wpm" class="stat-value">0 WPM</span>
            </div>
        </section>
        
        <main class="typing-container" aria-label="Typing area">
            <div id="text-display" class="text-display"></div>
        </main>
    </div>

    <div id="results" class="results-screen hidden">
        <div class="results-content">
            <h1>Test Complete!</h1>
            <h2>Great work — here are your results.</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <h3>Words Per Minute</h3>
                    <span id="final-wpm">0</span>
                </div>
                <div class="stat-box">
                    <h3>Accuracy</h3>
                    <span id="accuracy">0%</span>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="speedChart"></canvas>
            </div>
            
            <div class="results-hint" aria-label="Restart hint in results">
                <span>Press</span>
                <kbd>`</kbd>
                <span>to try again</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
